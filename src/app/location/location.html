<h3 style="margin-left: 12px;">Add Location</h3>
<form 
style="margin-left: 12px !important">
<input style="display:none;" type="text" name="Location" placeholder="" [formControl]="id">
<br><br>
    <input type="text" name="LocationName" placeholder="Location Name" [formControl]="LocationName">
    <br><br>
    <input type="text" name="LAddress" placeholder="Address" [formControl]="LocationAddress">
    <br><br>
    <input type="text" name="DocNoDigit" placeholder="Doc Number digit" [formControl]="DocDigit">

    <br><br>
    <button>Clear</button>
    <button style="margin:10px">Save</button>

</form>
